<div class="kanban-card group relative hazon-card-sm p-3.5 transition hover:border-[#74b3c6]/40 hover:bg-white/10"
     {% if web_pode_editar %}draggable="true"{% endif %} data-id="{{ card.id }}">
  <div class="mb-1.5 flex items-start justify-between gap-2">
    <a href="{% url 'contatos:detalhe' card.contato_id %}" class="text-[13.5px] font-semibold text-white hover:text-[#74b3c6]">{{ card.nome }}</a>
  </div>
  <div class="mb-2 text-[11.5px] text-[#6f8a93]">{{ card.empresa }}</div>

  <!-- Perfil do contato (rico x pobre): barra de completude -->
  <div class="mb-2.5 flex items-center gap-2"
       title="Perfil {{ card.completude.total }}% — {{ card.completude.label }}{% if card.completude.faltam %} · falta: {{ card.completude.faltam|join:', ' }}{% endif %}">
    <div class="h-1 flex-1 overflow-hidden rounded-full bg-white/10">
      <div class="h-full rounded-full transition-all duration-300" style="width:{{ card.completude.total }}%;background:{{ card.completude.cor }}"></div>
    </div>
    <span class="font-mono text-[10px] font-bold" style="color:{{ card.completude.cor }}">{{ card.completude.total }}%</span>
  </div>

  <div class="mb-2 flex items-center justify-between gap-2">
    <span class="hazon-chip px-2 font-semibold" style="color:{{ card.seg_color }};background:{{ card.seg_color }}1a">{{ card.seg_label }}</span>
    <span class="hazon-chip px-2 font-mono {% if card.score_nivel == 'quente' %}text-[#4ade80] bg-[#4ade80]/15{% elif card.score_nivel == 'morno' %}text-[#fbbf24] bg-[#fbbf24]/15{% else %}text-[#94a3b8] bg-white/10{% endif %}" title="Lead scoring">{{ card.score }}</span>
  </div>
  <div class="flex items-center justify-between gap-2">
    <span class="text-[10px] font-bold uppercase tracking-wide {% if card.score_nivel == 'quente' %}text-[#4ade80]{% elif card.score_nivel == 'morno' %}text-[#fbbf24]{% else %}text-[#6f8a93]{% endif %}">{{ card.score_nivel }}</span>
    <span class="font-mono text-[13.5px] font-bold text-[#74b3c6]">{{ card.valor }}</span>
  </div>
  {% if web_pode_editar %}
  <div class="mt-2 hidden border-t border-white/10 pt-2 group-hover:block">
    <form method="post" action="{% url 'funil:mover' card.id %}">
      {% csrf_token %}
      <select name="stage" onchange="this.form.submit()"
              class="w-full rounded-lg border border-white/10 bg-[#0b2029] px-2 py-1.5 text-[11.5px] text-white outline-none">
        {% for st in stages %}
          <option value="{{ st.key }}" {% if st.key == col.key %}selected{% endif %}>{{ st.name }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
  {% endif %}
</div>
