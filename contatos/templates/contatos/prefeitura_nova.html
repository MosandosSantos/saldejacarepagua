{% extends 'base/basic.html' %}

{% block titulo %}SAL DO REAA CRM — Novo Vale{% endblock %}

{% block conteudo %}
<div class="mb-6">
  <a href="{% url 'vales' %}" class="inline-flex items-center gap-1.5 text-[13px] font-medium text-[#a6bfc7] transition hover:text-white">
    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar
  </a>
</div>

<div class="mx-auto max-w-2xl">
  <div class="hazon-card-sm p-7 backdrop-blur-xl">
    <div class="mb-6 flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-[11px] bg-[#4ade80]/15">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
      <div>
        <h1 class="font-display text-lg font-semibold text-white">Novo Vale</h1>
        <p class="text-[13px] text-[#a6bfc7]">Preencha os dados abaixo</p>
      </div>
    </div>

    {% if erro %}
      <div id="form-erro" class="mb-4 rounded-xl border border-red-400/40 bg-red-500/15 px-4 py-3 text-[13.5px] font-semibold text-[#ffd9d9]" role="alert">{{ erro }}</div>
    {% endif %}

    <form method="post" action="{% url 'contatos:prefeitura_nova' %}" aria-label="Cadastrar novo Vale" {% if erro %}aria-describedby="form-erro"{% endif %} data-unsaved-guard>
      {% csrf_token %}
      <div class="grid gap-5">
        <div>
          <label for="nome" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Nome *</label>
          <input type="text" id="nome" autocomplete="organization" name="nome" required placeholder="Ex: Vale Centro-Oeste"
                 class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="sigla" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Sigla *</label>
            <input type="text" id="sigla" autocomplete="off" spellcheck="false" name="sigla" placeholder="Ex: PCO" maxlength="10" required
                   class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
          </div>
          <div>
            <label for="prefeito" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Delegado</label>
            <input type="text" id="prefeito" name="prefeito" placeholder="Nome do delegado" autocomplete="name"
                   class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
          </div>
        </div>

        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="telefone" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Telefone</label>
            <input type="tel" id="telefone" autocomplete="tel" name="telefone" placeholder="(21) 99999-9999"
                   class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
          </div>
          <div>
            <label for="email" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">E-mail do Delegado</label>
            <input type="email" id="email" autocomplete="email" spellcheck="false" name="email" placeholder="graomestre@potencia.com"
                   class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
          </div>
        </div>

        <div class="col-span-full border-t border-white/10 pt-5">
          <p class="mb-4 text-[10px] font-bold uppercase tracking-[0.16em] text-[#5b8def]">Secretaria</p>
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="secretario_nome" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Nome do Secretário</label>
              <input type="text" id="secretario_nome" autocomplete="name" name="secretario_nome" placeholder="Nome do secretário"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
            <div>
              <label for="secretario_email" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">E-mail do Secretário</label>
              <input type="email" id="secretario_email" autocomplete="email" spellcheck="false" name="secretario_email" placeholder="secretaria@potencia.com"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
            <div>
              <label for="secretario_telefone" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Telefone do Secretário</label>
              <input type="tel" id="secretario_telefone" autocomplete="tel" name="secretario_telefone" placeholder="(21) 99999-9999"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
          </div>
        </div>

        <div class="col-span-full">
          <p class="mb-4 text-[10px] font-bold uppercase tracking-[0.16em] text-[#5b8def]">Tesouraria</p>
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="tesoureiro_nome" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Nome do Tesoureiro</label>
              <input type="text" id="tesoureiro_nome" autocomplete="name" name="tesoureiro_nome" placeholder="Nome do tesoureiro"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
            <div>
              <label for="tesoureiro_email" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">E-mail do Tesoureiro</label>
              <input type="email" id="tesoureiro_email" autocomplete="email" spellcheck="false" name="tesoureiro_email" placeholder="tesouraria@potencia.com"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
            <div>
              <label for="tesoureiro_telefone" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Telefone do Tesoureiro</label>
              <input type="tel" id="tesoureiro_telefone" autocomplete="tel" name="tesoureiro_telefone" placeholder="(21) 99999-9999"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#5b8def]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#5b8def]/15">
            </div>
          </div>
        </div>

        <div class="col-span-full border-t border-white/10 pt-5">
          <p class="mb-4 text-[10px] font-bold uppercase tracking-[0.16em] text-[#4ade80]">Mensalidade</p>
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="valor_anuidade" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Valor da Mensalidade (R$)</label>
              <input type="text" id="valor_anuidade" autocomplete="off" inputmode="decimal" name="valor_anuidade" placeholder="Ex: 1.500,00" inputmode="decimal"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#4ade80]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#4ade80]/15">
            </div>
            <div>
              <label for="vencimento_anuidade" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">Data de Vencimento</label>
              <input type="date" id="vencimento_anuidade" name="vencimento_anuidade"
                     class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition [color-scheme:dark] focus:border-[#4ade80]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#4ade80]/15">
            </div>
          </div>
        </div>

        <div class="col-span-full">
          <label for="pix" class="mb-2 block text-[10px] font-bold uppercase tracking-[0.16em] text-[#a6bfc7]">PIX do Vale</label>
          <input type="text" id="pix" autocomplete="off" spellcheck="false" name="pix" placeholder="Chave PIX para pagamento da mensalidade"
                 class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-[14px] text-white outline-none transition placeholder:text-white/40 focus:border-[#4ade80]/60 focus:bg-white/10 focus:ring-4 focus:ring-[#4ade80]/15">
        </div>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <button type="submit" class="flex items-center gap-2 rounded-xl border border-[#5b8def]/50 bg-gradient-to-br from-[#1a5fb4] to-[#1450a0] px-6 py-3 text-[14px] font-bold text-white shadow-lg shadow-[#1a5fb4]/30 transition hover:brightness-110">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Salvar
        </button>
        <a href="{% url 'vales' %}" class="rounded-xl border border-white/15 bg-white/5 px-6 py-3 text-[14px] font-medium text-[#a6bfc7] transition hover:bg-white/10 hover:text-white">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
