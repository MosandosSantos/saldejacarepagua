{% load seguranca %}
<div class="hazon-card-sm flex flex-col p-5 backdrop-blur-xl">
  <div class="mb-4">
    <h3 class="text-[14px] font-semibold text-white">Candidatos</h3>
    <p class="text-[11px] text-[#6f8a93]">quem quer ingressar · recepção</p>
  </div>

  {% if candidatos_card.total %}
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-[12px]">
        <thead>
          <tr class="border-b border-white/10 text-left">
            <th class="pb-2 pr-2 text-[10px] font-bold uppercase tracking-wider text-[#6f8a93]">Nome</th>
            <th class="pb-2 pr-2 text-[10px] font-bold uppercase tracking-wider text-[#6f8a93]">Loja pretendida</th>
            <th class="pb-2 pr-2 text-center text-[10px] font-bold uppercase tracking-wider text-[#6f8a93]">Inclusão</th>
            <th class="pb-2 text-center text-[10px] font-bold uppercase tracking-wider text-[#6f8a93]">Loja simbólica</th>
          </tr>
        </thead>
        <tbody id="cand-table-body"></tbody>
      </table>
    </div>
    <div id="cand-pagination" class="mt-4 flex items-center justify-center gap-2"></div>
  {% else %}
    <div class="flex flex-col items-center justify-center gap-2 py-8 text-center">
      <svg viewBox="0 0 24 24" class="h-8 w-8 opacity-60" fill="none" stroke="#5b8def" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M19 8v6M22 11h-6"/>
      </svg>
      <p class="text-[12px] font-medium text-[#a6bfc7]">Nenhum candidato no momento</p>
      <p class="max-w-[220px] text-[11px] text-[#6f8a93]">Quem pedir ingresso aparece aqui, mais recente primeiro.</p>
    </div>
  {% endif %}
</div>

<script>
(function () {
  var dados = {{ candidatos_card.itens|js }};
  if (!dados || !dados.length) return;

  var perPage = 5;
  var page = 1;
  var totalPages = Math.ceil(dados.length / perPage);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var tbody = document.getElementById('cand-table-body');
    var pag = document.getElementById('cand-pagination');
    if (!tbody) return;

    var start = (page - 1) * perPage;
    var slice = dados.slice(start, start + perPage);

    var html = '';
    slice.forEach(function (c) {
      html += '<tr class="border-b border-white/5">';
      html += '<td class="py-2 pr-2"><span class="block max-w-[150px] truncate font-medium text-white" title="' + esc(c.nome) + '">' + esc(c.nome) + '</span></td>';
      html += '<td class="py-2 pr-2"><span class="block max-w-[130px] truncate text-[#a6bfc7]" title="' + esc(c.loja) + '">' + esc(c.loja || '—') + '</span></td>';
      html += '<td class="py-2 pr-2 text-center font-mono text-[11px] text-[#a6bfc7]">' + esc(c.data) + '</td>';
      html += '<td class="py-2 text-center"><span class="block max-w-[130px] truncate text-[#a6bfc7]" title="' + esc(c.loja_simbolo) + '">' + esc(c.loja_simbolo || '—') + '</span></td>';
      html += '</tr>';
    });
    tbody.innerHTML = html;

    if (!pag) return;
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    var phtml = '';
    for (var i = 1; i <= totalPages; i++) {
      phtml += '<button data-page="' + i + '" class="cand-page h-7 min-w-[28px] rounded-lg px-2 text-[11px] font-bold transition ';
      if (i === page) {
        phtml += 'bg-[#5b8def]/20 text-[#5b8def] border border-[#5b8def]/30';
      } else {
        phtml += 'bg-white/5 text-[#6f8a93] border border-white/10 hover:bg-white/10 hover:text-white';
      }
      phtml += '">' + i + '</button> ';
    }
    pag.innerHTML = phtml;
    pag.querySelectorAll('.cand-page').forEach(function (btn) {
      btn.addEventListener('click', function () {
        page = parseInt(this.getAttribute('data-page'));
        render();
      });
    });
  }

  render();
})();
</script>
