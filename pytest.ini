[pytest]
DJANGO_SETTINGS_MODULE = core.settings_vale_test
python_files = test_*.py
testpaths = teste
pythonpath = .
# --create-db em vez de --reuse-db: com reuse, quando uma migration e
# renomeada/renumerada depois de aplicada, o historico do banco de testes fica
# inconsistente e a suite inteira passa a dar ERROR (InconsistentMigrationHistory).
# Recriar sempre e mais lento (~20s) mas nunca desalinha do codigo.
addopts = --create-db
