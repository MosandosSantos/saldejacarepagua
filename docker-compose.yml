services:
  # ============================================
  # PostgreSQL - Banco de Dados
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: gprbr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-saldabritanea}
      POSTGRES_USER: ${DB_USER:-gprbr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Publica apenas no loopback: o app acessa o banco pela rede interna.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gprbr} -d ${DB_NAME:-saldabritanea}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gprbr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis - Cache e Sessões
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gprbr-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      # Publica apenas no loopback: o app acessa o Redis pela rede interna.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gprbr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Aplicação Django + FastAPI
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    container_name: gprbr-app
    restart: unless-stopped
    environment:
      # Django
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-core.settings}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_PORT=8111
      - JWT_SECRET=${JWT_SECRET:-}
      - CRYPTO_KEY=${CRYPTO_KEY:-}
      - TOKEN_TTL_DIAS=${TOKEN_TTL_DIAS:-7}
      
      # Database
      - DATABASE_URL=postgresql://${DB_USER:-gprbr}:${DB_PASSWORD:-securepassword123}@db:5432/${DB_NAME:-saldabritanea}
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
      
      # Email (opcional)
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-1}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      # Vazio = envia aos membros; preenchido = modo de teste (redireciona tudo)
      - EVENTO_EMAIL_PARA_TESTE=${EVENTO_EMAIL_PARA_TESTE:-}
      - BASE_URL=${BASE_URL:-https://saldoreaa.cloud}

      # Cloudflare Turnstile (em DEBUG, usa as chaves oficiais de teste se vazias)
      - CLOUDFLARE_TURNSTILE_SITE_KEY=${CLOUDFLARE_TURNSTILE_SITE_KEY:-}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      
      # Tenant
      - GPRB_TENANT_ID=${GPRB_TENANT_ID:-}
      - GPRB_TENANT_NAME=${GPRB_TENANT_NAME:-}
      - GPRB_TENANT_CODE=${GPRB_TENANT_CODE:-SCG33REAA}
      - VALE_NOME=${VALE_NOME:-Jacarepaguá}
      
      # Segurança / SEO
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-saldoreaa.cloud,www.saldoreaa.cloud,localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://saldoreaa.cloud,https://www.saldoreaa.cloud}
      - SEO_SITE_URL=${SEO_SITE_URL:-https://saldoreaa.cloud}
      - DJANGO_SSL_REDIRECT=${DJANGO_SSL_REDIRECT:-0}
      - DJANGO_HSTS_SECONDS=${DJANGO_HSTS_SECONDS:-31536000}
      - SENTRY_DSN=${SENTRY_DSN:-}

      # Google Calendar (auto-sync do ranking; service account do app agenda)
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_WORKSPACE_ADMIN=${GOOGLE_WORKSPACE_ADMIN:-}
      - GOOGLE_RANKING_CALENDAR_ID=${GOOGLE_RANKING_CALENDAR_ID:-}
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      # O proxy de dominio (nginx em container) acessa http://<ip-do-host>:8111.
      # Publicar so no loopback quebra esse proxy: o container chega pelo IP
      # publico da VPS, nao por 127.0.0.1. O firewall da VPS mantem a porta
      # fechada para a internet.
      - "${APP_PORT:-8111}:8111"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gprbr-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================
  # Agenda cron - lembretes 48h/24h (idempotente)
  # ============================================
  agenda-cron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
    container_name: gprbr-agenda-cron
    restart: unless-stopped
    healthcheck:
      disable: true
    command: >
      sh -c "while true; do python manage.py agenda_lembretes; sleep 300; done"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-core.settings}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-this-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - JWT_SECRET=${JWT_SECRET:-}
      - CRYPTO_KEY=${CRYPTO_KEY:-}
      - DATABASE_URL=postgresql://${DB_USER:-gprbr}:${DB_PASSWORD:-securepassword123}@db:5432/${DB_NAME:-saldabritanea}
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-1}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - EVENTO_EMAIL_PARA_TESTE=${EVENTO_EMAIL_PARA_TESTE:-}
      - BASE_URL=${BASE_URL:-https://saldoreaa.cloud}
      - VALE_NOME=${VALE_NOME:-Jacarepaguá}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - GOOGLE_WORKSPACE_ADMIN=${GOOGLE_WORKSPACE_ADMIN:-}
      - GOOGLE_RANKING_CALENDAR_ID=${GOOGLE_RANKING_CALENDAR_ID:-}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gprbr-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ============================================
  # Locust - Teste de carga (opcional)
  # ============================================
  locust:
    image: locustio/locust:2.32.4
    container_name: gprbr-locust
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --host
      - ${LOCUST_TARGET_URL:-http://app:8111}
      - --web-host
      - 0.0.0.0
    environment:
      LOCUST_USERNAME: ${LOCUST_USERNAME:-}
      LOCUST_PASSWORD: ${LOCUST_PASSWORD:-}
      LOCUST_TURNSTILE_TOKEN: ${LOCUST_TURNSTILE_TOKEN:-}
    volumes:
      - ./locust:/mnt/locust:ro
    ports:
      - "127.0.0.1:${LOCUST_PORT:-8089}:8089"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - gprbr-network
    profiles:
      - load-test

  # ============================================
  # Nginx - Reverse Proxy (Opcional)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: gprbr-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/app/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - gprbr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gprbr-network:
    driver: bridge
