name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gprbr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit pytest-cov

      - name: Run checks
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Run Ruff on feature files
        run: >-
          python -m ruff check
          acesso/context_processors.py
          contatos/forms_graus.py
          contatos/models.py
          contatos/views/gprb_membros.py
          contatos/views/acompanhamento.py
          contatos/membros_urls.py
          contatos/views/__init__.py
          contatos/management/commands/limpar_historico_graus_teste.py
          teste/test_acompanhamento_graus.py
          teste/test_membro_grau_web.py
          teste/test_membro_local.py
          teste/test_vale_navigation.py

      - name: Build Docker image and verify Tailwind bundle
        run: |
          docker build --tag gprbrcrm-ci .
          docker run --rm --entrypoint python gprbrcrm-ci -c "from pathlib import Path; css = Path('/app/staticfiles/css/dist/styles.css').read_text(); assert 'minmax(0,2fr)' in css"

      - name: Run migrations
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Seed degree catalog
        run: python manage.py seed_graus
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Run member tracking feature tests
        run: >-
          python -m pytest --create-db
          teste/test_acompanhamento_graus.py
          teste/test_membro_grau_web.py
          teste/test_membro_local.py
          teste/test_membro_web.py
          teste/test_vale_navigation.py
          -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: core.settings_vale_test
          VALE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gprbr_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Run tests
        run: python -m pytest --create-db teste/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: core.settings_vale_test
          VALE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gprbr_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Run tests with coverage
        run: |
          python -m pytest --create-db teste/ --cov=. --cov-report=xml --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: core.settings_vale_test
          VALE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gprbr_test
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          PGDATABASE: gprbr_test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432

      - name: Security scan (Bandit)
        run: python -m bandit -r acesso candidatos contatos core dashboard emails funil gestao recepcao repositories tarefas -lll

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
