  <ellipse cx="236" cy="278" rx="8" ry="6" fill="#2c2c2c"/>
  <ellipse cx="276" cy="278" rx="8" ry="6" fill="#2c2c2c"/>
  <!-- Cheeks -->
  <ellipse cx="226" cy="298" rx="10" ry="6" fill="#e8a090" opacity="0.5"/>
  <ellipse cx="286" cy="298" rx="10" ry="6" fill="#e8a090" opacity="0.5"/>
  <!-- Mouth -->
