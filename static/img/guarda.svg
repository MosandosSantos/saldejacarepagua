  <path d="M196 215 Q196 260 210 280" stroke="#c9a84c" stroke-width="4" fill="none"/>
  <path d="M316 215 Q316 260 302 280" stroke="#c9a84c" stroke-width="4" fill="none"/>
  <!-- Face -->
  <ellipse cx="256" cy="290" rx="55" ry="60" fill="#f0c8a0"/>
