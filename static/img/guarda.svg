  <circle cx="256" cy="256" r="256" fill="#1a3a6e"/>
  <!-- Bearskin hat (tall black hat) -->
  <rect x="196" y="40" width="120" height="180" rx="20" fill="#1a1a1a"/>
  <rect x="186" y="200" width="140" height="30" rx="8" fill="#1a1a1a"/>
