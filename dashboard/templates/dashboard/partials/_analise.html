<div class="rounded-xl border border-white/10 bg-white/[0.03] p-5">
  <div class="mb-4">
    <h2 class="text-[14px] font-semibold text-white">Ranking das Lojas</h2>
    <p class="text-[11px] text-[#6f8a93]">top 10 por membros</p>
  </div>
  <div class="space-y-1">
    {% for l in ranking_lojas_dados %}
      <div class="flex items-center gap-2 py-1">
        <span class="w-4 shrink-0 text-right font-mono text-[11px]
          {% if l.rank <= 3 %}font-bold text-[#fbbf24]{% else %}text-[#6f8a93]{% endif %}">{{ l.rank }}.</span>
        <span class="min-w-0 flex-1 truncate text-[12px] text-[#a6bfc7]">{{ l.nome }}</span>
        <span class="font-mono text-[12px] font-bold text-white">{{ l.total }}</span>
      </div>
    {% empty %}
      <p class="py-4 text-center text-[12px] text-[#a6bfc7]">Nenhuma loja com membros no ranking.</p>
    {% endfor %}
  </div>
</div>
