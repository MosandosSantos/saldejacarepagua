<div class="flex items-center gap-6">
  <div class="w-[42%] min-w-0 shrink-0" id="baii-grafico">{{ baii_svg|safe }}</div>
  <div class="flex min-w-0 flex-1 flex-col gap-1.5">
    {% for b in baii %}
      <div class="flex items-center gap-3 rounded-[11px] border border-white/10 bg-white/5 px-3 py-2.5 transition hover:border-[#22c55e]/40 hover:bg-[#22c55e]/10">
        <span class="h-2.5 w-2.5 shrink-0 rounded" style="background:{{ b.color }};box-shadow:0 0 8px {{ b.color }}70"></span>
        <span class="flex-1 truncate text-[12.5px] font-medium text-[#bcd3da]">{{ b.name }} · {{ b.label }}</span>
        <span class="font-mono text-[13.5px] font-bold text-white">{{ b.count }}</span>
        <span class="w-12 shrink-0 text-right font-mono text-[11px] text-[#22c55e]">{{ b.pct }}%</span>
      </div>
    {% empty %}
      <div class="text-[12px] text-[#a6bfc7]">Nenhum dado disponível</div>
    {% endfor %}
    <div class="mt-2 flex items-center justify-between border-t border-white/10 pt-2">
      <span class="text-[11px] text-[#a6bfc7]">Total</span>
      <span class="font-mono text-[14px] font-bold text-[#22c55e]">{{ baii_total }}</span>
    </div>
  </div>
</div>

<script>
(function () {
  // O SVG e injetado pelo backend: garante role="img" + rotulo acessivel no proprio SVG.
  var svg = document.getElementById('baii-grafico');
  if (!svg) return;
  svg = svg.querySelector('svg');
  if (!svg) return;
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Grafico de piramide de graus dos membros');
})();
</script>
